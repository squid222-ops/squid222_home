<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>예약 문의</title>
    <link rel="stylesheet" href="./css/contact.css" />
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand-logo" href="./index.html">홈</a>
        <nav class="site-nav" aria-label="메인 메뉴">
          <a href="./index.html">홈</a>
          <a href="./menu.html">메뉴</a>
          <a href="./about.html">가게소개</a>
          <a href="./contact.html" class="active">예약 문의</a>
        </nav>
      </div>
    </header>

    <main class="contact-main">
      <h1>예약 문의</h1>
      <p class="contact-desc">
        예약 및 일반 문의 내용을 남겨 주시면 확인 후 답변드리겠습니다.
      </p>

      <form id="contact-form" class="contact-form">
        <div class="field">
          <label for="name">이름</label>
          <input
            id="name"
            type="text"
            name="name"
            placeholder="이름을 입력하세요"
            required
          />
        </div>

        <div class="field">
          <label for="email">답장 받을 이메일</label>
          <input
            id="email"
            type="email"
            name="email"
            placeholder="example@email.com"
            required
          />
        </div>

        <div class="field">
          <label for="title">제목</label>
          <input
            id="title"
            type="text"
            name="title"
            placeholder="문의 제목을 입력하세요"
            required
          />
        </div>

        <div class="field">
          <label for="message">문의 내용</label>
          <textarea
            id="message"
            name="message"
            placeholder="예약 희망 일시와 인원, 문의 내용을 입력하세요"
            required
          ></textarea>
        </div>

        <button id="submit-btn" type="submit">보내기</button>
      </form>
    </main>

    <script>
      const SERVICE_ID = "service_zquinco";
      const TEMPLATE_ID = "template_g5q2ttn";
      const PUBLIC_KEY = "MlPvie1awE0ODpz5O";

      emailjs.init({
        publicKey: PUBLIC_KEY,
      });

      const form = document.getElementById("contact-form");
      const submitBtn = document.getElementById("submit-btn");

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        submitBtn.disabled = true;
        submitBtn.textContent = "전송 중...";

        try {
          await emailjs.sendForm(SERVICE_ID, TEMPLATE_ID, "#contact-form");
          alert("예약 문의 메일이 정상적으로 발송되었습니다.");
          form.reset();
        } catch (error) {
          alert("메일 발송에 실패했습니다. 콘솔(F12)을 확인해 주세요.");
          console.error("EmailJS 전송 오류:", error);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "보내기";
        }
      });
    </script>
  </body>
</html>
