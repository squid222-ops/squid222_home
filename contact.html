<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>문의하기</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
      body {
        font-family: sans-serif;
        max-width: 480px;
        margin: 40px auto;
        padding: 0 16px;
      }
      .field {
        margin-bottom: 12px;
      }
      label {
        display: block;
        margin-bottom: 4px;
        font-weight: bold;
      }
      input,
      textarea {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
      }
      textarea {
        min-height: 120px;
      }
      button {
        padding: 10px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>문의하기</h1>

    <form id="contact-form">
      <div class="field">
        <label for="name">이름</label>
        <input
          id="name"
          type="text"
          name="name"
          placeholder="이름을 입력하세요"
          required
        />
      </div>

      <div class="field">
        <label for="email">답장 받을 이메일</label>
        <input
          id="email"
          type="email"
          name="email"
          placeholder="example@email.com"
          required
        />
      </div>

      <div class="field">
        <label for="title">제목</label>
        <input
          id="title"
          type="text"
          name="title"
          placeholder="문의 제목을 입력하세요"
          required
        />
      </div>

      <div class="field">
        <label for="message">문의 내용</label>
        <textarea
          id="message"
          name="message"
          placeholder="문의 내용을 입력하세요"
          required
        ></textarea>
      </div>

      <button id="submit-btn" type="submit">보내기</button>
    </form>

    <script>
      const SERVICE_ID = "service_zqulnco";
      const TEMPLATE_ID = "template_g5q2ttn";
      const PUBLIC_KEY = "MlPvie1awE0ODpz5O";

      emailjs.init({
        publicKey: PUBLIC_KEY,
      });

      const form = document.getElementById("contact-form");
      const submitBtn = document.getElementById("submit-btn");

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        submitBtn.disabled = true;
        submitBtn.textContent = "전송 중...";

        try {
          await emailjs.sendForm(SERVICE_ID, TEMPLATE_ID, "#contact-form");
          alert("메일이 정상적으로 발송되었습니다.");
          form.reset();
        } catch (error) {
          alert("메일 발송에 실패했습니다. 콘솔(F12)을 확인해 주세요.");
          console.error("EmailJS 전송 오류:", error);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "보내기";
        }
      });
    </script>
  </body>
</html>
